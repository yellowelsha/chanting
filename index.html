<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>持誦</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@200;300;400&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
:root {
  --gold-deep: #8B6914;
  --gold-mid: #C9960C;
  --gold-bright: #E8B84B;
  --gold-pale: #F5D98A;
  --gold-whisper: #FDF3D6;
  --cream: #FBF5E6;
  --ivory: #F7EDD5;
  --parchment: #EFE0B0;
  --text-dark: #3D2B00;
  --text-mid: #6B4E00;
  --text-light: #9C7A2A;
  --shadow-gold: rgba(139,105,20,0.15);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{height:100%;}
body{
  background:var(--cream);
  font-family:'Noto Serif TC',serif;
  color:var(--text-dark);
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  align-items:center;
  overflow-x:hidden;
}
body::before{
  content:'';
  position:fixed;inset:0;
  background:
    radial-gradient(ellipse at 20% 10%,rgba(233,184,75,.08) 0%,transparent 60%),
    radial-gradient(ellipse at 80% 90%,rgba(201,150,12,.06) 0%,transparent 60%),
    repeating-linear-gradient(0deg,transparent,transparent 40px,rgba(139,105,20,.015) 40px,rgba(139,105,20,.015) 41px);
  pointer-events:none;z-index:0;
}
.top-bar,.bottom-bar{
  width:100%;height:3px;
  background:linear-gradient(90deg,transparent,var(--gold-mid),var(--gold-bright),var(--gold-mid),transparent);
  flex-shrink:0;position:relative;z-index:1;
}
.page-wrap{
  width:100%;max-width:480px;
  display:flex;flex-direction:column;align-items:center;
  flex:1;position:relative;z-index:1;
  padding-bottom:28px;
}

/* ── HEADER ── */
.header{text-align:center;padding:18px 20px 10px;width:100%;}
.title-ornament{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:5px;}
.ornament-line{height:1px;width:36px;background:linear-gradient(90deg,transparent,var(--gold-mid));}
.ornament-line.right{background:linear-gradient(90deg,var(--gold-mid),transparent);}
.ornament-diamond{width:5px;height:5px;background:var(--gold-mid);transform:rotate(45deg);}
.title-main{font-size:22px;font-weight:200;letter-spacing:.6em;color:var(--text-mid);}
.title-sub{font-size:11px;font-weight:300;letter-spacing:.3em;color:var(--text-light);font-family:'Cormorant Garamond',serif;font-style:italic;margin-top:2px;}

/* ── SUTRA SELECTOR ── */
.sutra-section{width:100%;padding:0 20px;display:flex;flex-direction:column;gap:10px;}
.sutra-select-wrap{position:relative;width:100%;}
.sutra-select-wrap::after{content:'▾';position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--gold-mid);font-size:12px;pointer-events:none;}
select.sutra-select{
  width:100%;padding:10px 36px 10px 14px;
  background:linear-gradient(135deg,rgba(255,248,220,.95),rgba(245,225,150,.5));
  border:1px solid rgba(201,150,12,.35);border-radius:3px;
  font-family:'Noto Serif TC',serif;font-size:13px;font-weight:300;
  color:var(--text-mid);letter-spacing:.15em;cursor:pointer;
  appearance:none;-webkit-appearance:none;
  box-shadow:0 2px 8px var(--shadow-gold),inset 0 1px 0 rgba(255,255,255,.5);
  outline:none;
}

/* ── SUTRA DISPLAY CARD ── */
.sutra-image-card{
  width:100%;min-height:100px;
  background:linear-gradient(135deg,rgba(255,248,220,.9),rgba(245,225,150,.45));
  border:1px dashed rgba(201,150,12,.4);border-radius:4px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;cursor:pointer;position:relative;overflow:hidden;
  box-shadow:0 2px 10px var(--shadow-gold);transition:border-color .2s;
}
.sutra-image-card:hover{border-color:var(--gold-mid);}
.sutra-image-card.has-image{border-style:solid;}
.upload-icon{font-size:20px;color:var(--gold-mid);}
.upload-hint{font-size:11px;font-weight:300;letter-spacing:.25em;color:var(--text-light);}
.upload-sub{font-size:10px;color:var(--text-light);opacity:.7;letter-spacing:.2em;}
#uploadInput{display:none;}
#uploadedImg{display:none;width:100%;max-height:160px;object-fit:contain;padding:8px;}
.sutra-image-card.has-image .upload-icon,
.sutra-image-card.has-image .upload-hint,
.sutra-image-card.has-image .upload-sub{display:none;}
.sutra-image-card.has-image #uploadedImg{display:block;}
.img-remove-btn{
  display:none;position:absolute;top:6px;right:8px;
  background:rgba(139,105,20,.15);border:1px solid rgba(201,150,12,.3);
  border-radius:50%;width:22px;height:22px;cursor:pointer;
  font-size:12px;line-height:22px;text-align:center;color:var(--gold-deep);
}
.sutra-image-card.has-image .img-remove-btn{display:block;}

/* ── HORIZONTAL RUBY SUTRA TEXT ── */
.sutra-horiz-card{
  width:100%;
  background:linear-gradient(135deg,rgba(255,248,220,.9),rgba(245,225,150,.4));
  border:1px solid rgba(201,150,12,.22);border-radius:4px;
  padding:14px 16px;
  box-shadow:0 2px 10px var(--shadow-gold),inset 0 1px 0 rgba(255,255,255,.4);
  max-height:150px;
  overflow-y:auto;
  scrollbar-width:thin;
  scrollbar-color:var(--parchment) transparent;
}
.sutra-horiz-card::-webkit-scrollbar{width:3px;}
.sutra-horiz-card::-webkit-scrollbar-thumb{background:var(--parchment);border-radius:2px;}

.sutra-horiz-text{
  font-size:15px;
  font-weight:300;
  color:var(--text-dark);
  line-height:3;        /* generous line-height so rt doesn't overlap */
  letter-spacing:.06em;
  word-break:break-all;
}
.sutra-horiz-text ruby{
  ruby-position:over;
}
.sutra-horiz-text ruby rt{
  font-size:0.5em;
  color:var(--text-light);
  font-weight:300;
  letter-spacing:0;
  line-height:1;
}
.sutra-horiz-text .punct{
  color:var(--text-light);
  font-weight:200;
  font-size:14px;
}

/* ── COUNTER ── */
.counter-area{
  width:100%;display:flex;flex-direction:column;
  align-items:center;gap:12px;padding:14px 20px 6px;
}
.count-display{text-align:center;}
.count-number{
  font-size:96px;font-weight:200;line-height:1;
  color:var(--gold-deep);font-family:'Cormorant Garamond',serif;
  transition:transform .1s ease,opacity .1s ease;
  display:block;text-shadow:0 2px 10px rgba(139,105,20,.18);
  letter-spacing:-.02em;
}
.count-number.pulse{transform:scale(1.06);opacity:.8;}
.count-label{font-size:10px;letter-spacing:.5em;color:var(--text-light);font-weight:300;margin-top:2px;}
.progress-section{width:100%;display:flex;flex-direction:column;align-items:center;gap:8px;}
.progress-stats{display:flex;align-items:baseline;gap:4px;}
.progress-current{font-size:26px;font-weight:300;color:var(--gold-deep);font-family:'Cormorant Garamond',serif;}
.progress-sep{font-size:15px;color:var(--parchment);font-weight:200;}
.progress-total{font-size:17px;font-weight:300;color:var(--text-light);font-family:'Cormorant Garamond',serif;}
.progress-label{font-size:10px;letter-spacing:.35em;color:var(--text-light);font-weight:300;}
.progress-bar-track{width:100%;height:2px;background:var(--parchment);border-radius:2px;overflow:hidden;}
.progress-bar-fill{
  height:100%;background:linear-gradient(90deg,var(--gold-mid),var(--gold-bright));
  border-radius:2px;transition:width .4s cubic-bezier(.4,0,.2,1);width:0%;position:relative;
}
.progress-bar-fill::after{
  content:'';position:absolute;right:0;top:-2px;
  width:6px;height:6px;background:var(--gold-bright);border-radius:50%;
  box-shadow:0 0 4px var(--gold-bright);
}
.bead-row{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;max-width:260px;margin-top:2px;}
.bead-dot{width:7px;height:7px;border-radius:50%;border:1px solid rgba(201,150,12,.3);background:transparent;transition:all .25s ease;}
.bead-dot.filled{background:var(--gold-mid);border-color:var(--gold-deep);box-shadow:0 0 3px rgba(201,150,12,.5);}
.rounds-display{
  display:flex;align-items:center;gap:8px;
  background:rgba(201,150,12,.06);border:1px solid rgba(201,150,12,.15);
  padding:7px 18px;border-radius:2px;
}
.rounds-icon{width:15px;height:15px;border:1px solid var(--gold-mid);border-radius:50%;display:flex;align-items:center;justify-content:center;}
.rounds-icon::after{content:'';width:5px;height:5px;background:var(--gold-mid);border-radius:50%;}
.rounds-text{font-size:12px;font-weight:300;color:var(--text-mid);letter-spacing:.2em;}
.rounds-num{font-family:'Cormorant Garamond',serif;font-size:16px;color:var(--gold-deep);}

/* ── TAP BUTTON ── */
.tap-button-wrapper{
  width:100%;padding:14px 24px 12px;
  display:flex;flex-direction:column;align-items:center;gap:14px;
  position:relative;z-index:1;
}
.tap-btn-outer{
  width:120px;height:120px;border-radius:50%;
  background:linear-gradient(145deg,#e8c84a,#b07c0a);
  box-shadow:0 8px 0 #7a5506,0 12px 24px rgba(100,60,0,.45),0 2px 6px rgba(255,220,80,.3) inset;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;position:relative;
  transition:transform .08s ease,box-shadow .08s ease;
  -webkit-user-select:none;user-select:none;
  border:none;outline:none;
}
.tap-btn-outer:hover{box-shadow:0 9px 0 #7a5506,0 14px 28px rgba(100,60,0,.5),0 2px 8px rgba(255,230,100,.35) inset;}
.tap-btn-outer:active,.tap-btn-outer.pressed{
  transform:translateY(6px);
  box-shadow:0 2px 0 #7a5506,0 4px 12px rgba(100,60,0,.4),0 1px 4px rgba(255,220,80,.2) inset;
}
.tap-btn-inner{
  width:100px;height:100px;border-radius:50%;
  background:radial-gradient(circle at 38% 35%,#F0C840,#C9960C 55%,#9A6F08 100%);
  box-shadow:0 1px 3px rgba(255,230,100,.5) inset,0 -2px 6px rgba(80,40,0,.35) inset;
  border:1px solid rgba(255,210,60,.3);
  position:relative;overflow:hidden;
}
.tap-btn-inner::before{
  content:'';position:absolute;top:12%;left:18%;
  width:44%;height:30%;
  background:radial-gradient(ellipse,rgba(255,255,200,.28) 0%,transparent 80%);
  border-radius:50%;pointer-events:none;
}
.ripple{
  position:absolute;border-radius:50%;
  background:rgba(255,248,180,.35);
  transform:scale(0);
  animation:ripple-anim .55s linear forwards;
  pointer-events:none;
}
@keyframes ripple-anim{to{transform:scale(4);opacity:0;}}

/* ── CONTROLS ── */
.controls{display:flex;gap:10px;width:100%;max-width:340px;}
.control-btn{
  flex:1;padding:10px 6px;
  background:transparent;border:1px solid rgba(201,150,12,.3);border-radius:2px;
  cursor:pointer;font-size:11px;font-weight:300;letter-spacing:.22em;
  color:var(--text-light);font-family:'Noto Serif TC',serif;
  transition:all .2s ease;white-space:nowrap;
}
.control-btn:hover{background:rgba(201,150,12,.07);border-color:rgba(201,150,12,.55);color:var(--text-mid);}
.control-btn:active{background:rgba(201,150,12,.12);}

/* ── JOURNAL SECTION ── */
.journal-section{
  width:100%;padding:0 20px 4px;
}
.section-divider{
  display:flex;align-items:center;gap:10px;margin-bottom:12px;
}
.divider-line{flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(201,150,12,.25));}
.divider-line.right{background:linear-gradient(90deg,rgba(201,150,12,.25),transparent);}
.section-label{font-size:10px;letter-spacing:.4em;color:var(--text-light);font-weight:300;white-space:nowrap;}

.journal-card{
  background:linear-gradient(135deg,rgba(255,248,220,.85),rgba(245,225,150,.35));
  border:1px solid rgba(201,150,12,.2);border-radius:4px;
  padding:14px 16px;
  box-shadow:0 2px 8px var(--shadow-gold);
}
.journal-month{
  font-size:11px;font-weight:300;letter-spacing:.3em;color:var(--text-light);
  text-align:center;margin-bottom:10px;font-family:'Cormorant Garamond',serif;
  font-style:italic;
}
.calendar-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:4px;
}
.cal-header{
  font-size:9px;letter-spacing:.1em;color:var(--text-light);
  text-align:center;padding:2px 0;font-weight:300;
}
.cal-day{
  aspect-ratio:1;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:300;color:var(--text-light);
  font-family:'Cormorant Garamond',serif;
  border-radius:50%;
  position:relative;
  transition:all .2s ease;
}
.cal-day.empty{opacity:0;}
.cal-day.today{
  color:var(--gold-deep);font-weight:400;
}
.cal-day.today::after{
  content:'';position:absolute;bottom:1px;left:50%;transform:translateX(-50%);
  width:3px;height:3px;background:var(--gold-mid);border-radius:50%;
}
.cal-day.completed{
  background:var(--gold-mid);color:var(--gold-whisper);
  box-shadow:0 0 6px rgba(201,150,12,.4);
  font-weight:400;
}
.cal-day.completed.today{
  background:var(--gold-deep);
}
.cal-day.completed.today::after{display:none;}

.journal-stats{
  display:flex;justify-content:center;gap:20px;margin-top:10px;
  padding-top:10px;border-top:1px solid rgba(201,150,12,.12);
}
.stat-item{text-align:center;}
.stat-num{font-size:20px;font-weight:300;color:var(--gold-deep);font-family:'Cormorant Garamond',serif;display:block;}
.stat-label{font-size:9px;letter-spacing:.25em;color:var(--text-light);font-weight:300;}

/* ── MODALS (shared base) ── */
.modal-overlay{
  position:fixed;inset:0;
  background:rgba(61,43,0,.55);backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;
  z-index:200;opacity:0;pointer-events:none;
  transition:opacity .35s ease;
}
.modal-overlay.show{opacity:1;pointer-events:all;}
.modal-card{
  background:var(--cream);border:1px solid var(--gold-mid);
  padding:36px 30px;text-align:center;
  max-width:280px;width:90%;
  box-shadow:0 20px 60px rgba(139,105,20,.4);
  transform:translateY(20px);
  transition:transform .4s cubic-bezier(.4,0,.2,1);
}
.modal-overlay.show .modal-card{transform:translateY(0);}
.modal-symbol{font-size:28px;margin-bottom:12px;display:block;}
.modal-title{font-size:17px;font-weight:200;letter-spacing:.4em;color:var(--gold-deep);margin-bottom:8px;}
.modal-subtitle{font-size:11px;font-weight:300;color:var(--text-light);letter-spacing:.22em;line-height:1.9;margin-bottom:22px;}
.modal-btn{
  padding:11px 26px;
  background:linear-gradient(145deg,#C9960C,#A07408);
  border:none;border-radius:2px;color:var(--gold-whisper);
  font-size:12px;letter-spacing:.4em;font-weight:300;
  font-family:'Noto Serif TC',serif;cursor:pointer;
  box-shadow:0 4px 12px rgba(139,105,20,.3);
}
/* Confirm modal extra */
.modal-btn-row{display:flex;gap:10px;justify-content:center;}
.modal-btn.ghost{
  background:transparent;border:1px solid rgba(201,150,12,.4);
  color:var(--text-light);box-shadow:none;
}
.modal-btn.ghost:hover{background:rgba(201,150,12,.07);}

/* PC */
@media(min-width:600px){
  .tap-btn-outer{width:136px;height:136px;}
  .tap-btn-inner{width:114px;height:114px;}
  .count-number{font-size:110px;}
  .sutra-horiz-card{max-height:180px;}
}
</style>
</head>
<body>

<div class="top-bar"></div>
<div class="page-wrap">

  <!-- HEADER -->
  <div class="header">
    <div class="title-ornament">
      <div class="ornament-line"></div>
      <div class="ornament-diamond"></div>
      <div class="ornament-line right"></div>
    </div>
    <div class="title-main">持　誦</div>
    <div class="title-sub">Sutra Recitation</div>
  </div>

  <!-- SUTRA SELECTOR -->
  <div class="sutra-section">
    <div class="sutra-select-wrap">
      <select class="sutra-select" id="sutraSelect" onchange="onSutraChange()">
        <option value="upload">── 上傳經文圖片 ──</option>
        <option value="xinjing">般若波羅蜜多心經</option>
        <option value="jinggang">金剛經（開篇）</option>
      </select>
    </div>

    <!-- Image upload card -->
    <div class="sutra-image-card" id="imageCard" onclick="triggerUpload()">
      <div class="upload-icon">☁</div>
      <div class="upload-hint">上 傳 經 文 圖 片</div>
      <div class="upload-sub">點擊選取圖片</div>
      <img id="uploadedImg" alt="經文圖片" />
      <button class="img-remove-btn" id="removeImgBtn" onclick="removeImage(event)">✕</button>
      <input type="file" id="uploadInput" accept="image/*" onchange="onImageUpload(event)" />
    </div>

    <!-- Horizontal ruby sutra text card -->
    <div class="sutra-horiz-card" id="sutraVertCard" style="display:none;">
      <div class="sutra-horiz-text" id="sutraVertInner"></div>
    </div>
  </div>

  <!-- COUNTER -->
  <div class="counter-area">
    <div class="count-display">
      <span class="count-number" id="countNumber">0</span>
      <div class="count-label">計　次</div>
    </div>
    <div class="progress-section">
      <div class="progress-stats">
        <span class="progress-current" id="progressCurrent">0</span>
        <span class="progress-sep">&thinsp;/&thinsp;</span>
        <span class="progress-total">108</span>
      </div>
      <div class="progress-label">本 輪 進 度</div>
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progressBar"></div>
      </div>
      <div class="bead-row" id="beadRow"></div>
    </div>
    <div class="rounds-display">
      <div class="rounds-icon"></div>
      <div class="rounds-text">已圓滿&ensp;<span class="rounds-num" id="roundsNum">0</span>&ensp;輪</div>
    </div>
  </div>

  <!-- TAP BUTTON -->
  <div class="tap-button-wrapper">
    <button class="tap-btn-outer" id="tapButton" onclick="handleTap(event)" aria-label="計次">
      <div class="tap-btn-inner"></div>
    </button>
    <div class="controls">
      <button class="control-btn" onclick="undoOne()">退 回 一 次</button>
      <button class="control-btn" onclick="askReset()">重 新 計 次</button>
    </div>
  </div>

  <!-- JOURNAL -->
  <div class="journal-section">
    <div class="section-divider">
      <div class="divider-line"></div>
      <div class="section-label">持 誦 日 誌</div>
      <div class="divider-line right"></div>
    </div>
    <div class="journal-card">
      <div class="journal-month" id="journalMonth"></div>
      <div class="calendar-grid" id="calendarGrid"></div>
      <div class="journal-stats">
        <div class="stat-item">
          <span class="stat-num" id="statDays">0</span>
          <span class="stat-label">本月持誦天數</span>
        </div>
        <div class="stat-item">
          <span class="stat-num" id="statStreak">0</span>
          <span class="stat-label">連續持誦天數</span>
        </div>
      </div>
    </div>
  </div>

</div><!-- end page-wrap -->
<div class="bottom-bar"></div>

<!-- ── COMPLETION MODAL ── -->
<div class="modal-overlay" id="modalComplete">
  <div class="modal-card">
    <span class="modal-symbol">✦</span>
    <div class="modal-title">圓　滿</div>
    <div class="modal-subtitle">一輪 108 遍持誦圓滿<br>功德無量，迴向眾生</div>
    <button class="modal-btn" onclick="continueNext()">繼 續 持 誦</button>
  </div>
</div>

<!-- ── CONFIRM RESET MODAL ── -->
<div class="modal-overlay" id="modalConfirm">
  <div class="modal-card">
    <span class="modal-symbol">◇</span>
    <div class="modal-title">確 認 歸 零</div>
    <div class="modal-subtitle">確定要將計次歸零重新開始？<br>本次記錄將會清除。</div>
    <div class="modal-btn-row">
      <button class="modal-btn ghost" onclick="closeConfirm()">取　消</button>
      <button class="modal-btn" onclick="doReset()">確　定</button>
    </div>
  </div>
</div>

<script>
/* ════════════════════════════════
   SUTRA DATA  (vertical rendering)
   Each entry is an array of columns.
   column = { chars: [{base, rt}], isPunct: bool }
   ════════════════════════════════ */

/* Helper to parse string like "字:ㄗˋ" arrays into column data */
function parseSutra(raw) {
  // raw: array of {b, r} objects or {p} for punctuation
  return raw;
}

const SUTRA_DATA = {
  xinjing: {
    title: '般若波羅蜜多心經',
    cols: buildCols([

function buildCols(tokens) {
  // Each token becomes one column: either a char+ruby pair, or a punct
  return tokens;
}

/* ── RENDER VERTICAL TEXT ── */
function renderVertical(tokens) {
  const container = document.getElementById('sutraVertInner');
  // Build HTML string — standard horizontal ruby
  let html = '';
  tokens.forEach(tok => {
    if (tok.p) {
      html += `<span class="punct">${tok.p}</span>`;
    } else {
      html += `<ruby>${tok.b}<rt>${tok.r || ''}</rt></ruby>`;
    }
  });
  container.innerHTML = html;
  container.scrollTop = 0;
}

/* ── SUTRA CHANGE ── */
function onSutraChange() {
  const val = document.getElementById('sutraSelect').value;
  const imgCard = document.getElementById('imageCard');
  const vertCard = document.getElementById('sutraVertCard');
  if (val === 'upload') {
    imgCard.style.display = 'flex';
    vertCard.style.display = 'none';
  } else if (SUTRA_DATA[val]) {
    imgCard.style.display = 'none';
    vertCard.style.display = 'block';
    renderVertical(SUTRA_DATA[val].cols);
  }
}

/* ── IMAGE UPLOAD ── */
function triggerUpload() { document.getElementById('uploadInput').click(); }
function onImageUpload(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    document.getElementById('uploadedImg').src = ev.target.result;
    document.getElementById('imageCard').classList.add('has-image');
  };
  reader.readAsDataURL(file);
}
function removeImage(e) {
  e.stopPropagation();
  document.getElementById('uploadedImg').src = '';
  document.getElementById('imageCard').classList.remove('has-image');
  document.getElementById('uploadInput').value = '';
}

/* ── BEAD DOTS ── */
const beadRow = document.getElementById('beadRow');
const BEAD_COUNT = 18;
const beads = [];
for (let i = 0; i < BEAD_COUNT; i++) {
  const d = document.createElement('div');
  d.className = 'bead-dot';
  beadRow.appendChild(d);
  beads.push(d);
}

/* ── STORAGE KEY ── */
const STORE_KEY = 'chanting_journal_v1';

function loadJournal() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY) || '{}'); }
  catch { return {}; }
}
function saveJournal(data) {
  localStorage.setItem(STORE_KEY, JSON.stringify(data));
}
function todayKey() {
  const n = new Date();
  return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;
}
function markTodayComplete() {
  const j = loadJournal();
  j[todayKey()] = true;
  saveJournal(j);
  renderJournal();
}

/* ── UPDATE UI ── */
function updateUI() {
  const bead = count % TOTAL;
  document.getElementById('countNumber').textContent = count;
  document.getElementById('progressCurrent').textContent = bead;
  document.getElementById('roundsNum').textContent = rounds;
  document.getElementById('progressBar').style.width = (bead / TOTAL * 100) + '%';
  const step = TOTAL / BEAD_COUNT;
  beads.forEach((b, i) => b.classList.toggle('filled', bead > i * step));
}

/* ── TAP ── */
function handleTap(e) {
  history.push({ count, rounds });
  count++;
  if (e && e.currentTarget) {
    const inner = e.currentTarget.querySelector('.tap-btn-inner');
    const rpl = document.createElement('span');
    rpl.className = 'ripple';
    rpl.style.cssText = `width:${inner.offsetWidth}px;height:${inner.offsetWidth}px;left:0;top:0;`;
    inner.appendChild(rpl);
    setTimeout(() => rpl.remove(), 600);
  }
  const numEl = document.getElementById('countNumber');
  numEl.classList.add('pulse');
  setTimeout(() => numEl.classList.remove('pulse'), 130);
  updateUI();
  if (count % TOTAL === 0) {
    rounds++;
    updateUI();
    markTodayComplete();
    setTimeout(() => document.getElementById('modalComplete').classList.add('show'), 300);
  }
}

function undoOne() {
  if (!history.length) return;
  const prev = history.pop();
  count = prev.count; rounds = prev.rounds;
  updateUI();
}

function askReset() {
  document.getElementById('modalConfirm').classList.add('show');
}
function closeConfirm() {
  document.getElementById('modalConfirm').classList.remove('show');
}
function doReset() {
  count = 0; rounds = 0; history = [];
  updateUI();
  closeConfirm();
}

function continueNext() {
  document.getElementById('modalComplete').classList.remove('show');
}

/* ── JOURNAL CALENDAR ── */
function renderJournal() {
  const now = new Date();
  const year = now.getFullYear();
  const month = now.getMonth(); // 0-based
  const todayDate = now.getDate();
  const j = loadJournal();

  // Month label
  const monthNames = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
  document.getElementById('journalMonth').textContent = `${year} 年　${monthNames[month]}`;

  // Day of week headers
  const days = ['日','一','二','三','四','五','六'];
  const grid = document.getElementById('calendarGrid');
  grid.innerHTML = '';
  days.forEach(d => {
    const h = document.createElement('div');
    h.className = 'cal-header';
    h.textContent = d;
    grid.appendChild(h);
  });

  // First day of month
  const firstDay = new Date(year, month, 1).getDay(); // 0=Sun
  const daysInMonth = new Date(year, month+1, 0).getDate();

  // Empty cells
  for (let i = 0; i < firstDay; i++) {
    const e = document.createElement('div');
    e.className = 'cal-day empty';
    grid.appendChild(e);
  }

  // Day cells
  let completedCount = 0;
  for (let d = 1; d <= daysInMonth; d++) {
    const key = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const done = !!j[key];
    if (done) completedCount++;
    const cell = document.createElement('div');
    cell.className = 'cal-day' + (done ? ' completed' : '') + (d === todayDate ? ' today' : '');
    cell.textContent = d;
    grid.appendChild(cell);
  }

  // Stats
  document.getElementById('statDays').textContent = completedCount;

  // Streak: count consecutive days ending today
  let streak = 0;
  const checkDate = new Date(now);
  while (true) {
    const k = `${checkDate.getFullYear()}-${String(checkDate.getMonth()+1).padStart(2,'0')}-${String(checkDate.getDate()).padStart(2,'0')}`;
    if (j[k]) {
      streak++;
      checkDate.setDate(checkDate.getDate() - 1);
    } else break;
  }
  document.getElementById('statStreak').textContent = streak;
}

/* ── KEYBOARD ── */
document.addEventListener('keydown', e => {
  if ((e.code === 'Space' || e.code === 'Enter') &&
      !document.getElementById('modalComplete').classList.contains('show') &&
      !document.getElementById('modalConfirm').classList.contains('show')) {
    e.preventDefault();
    const btn = document.getElementById('tapButton');
    handleTap({ currentTarget: btn });
    btn.classList.add('pressed');
    setTimeout(() => btn.classList.remove('pressed'), 150);
  }
  if (e.code === 'Escape') {
    closeConfirm();
    document.getElementById('modalComplete').classList.remove('show');
  }
});

/* ── INIT ── */
updateUI();
renderJournal();
</script>
</body>
</html>
